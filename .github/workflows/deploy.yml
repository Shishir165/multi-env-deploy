name: Deploy to Environment

on:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'dev' && 'development' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display deployment info
        run: |
          echo "🚀 Deploying to: ${{ vars.SITE_TITLE }}"
          echo "📂 Deploy path: ${{ vars.DEPLOY_PATH }}"
          echo "🎨 Site color: ${{ vars.SITE_COLOR }}"
          echo "🌿 Branch: ${{ github.ref_name }}"

      - name: Replace placeholders with environment values
        run: |
          DEPLOY_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          sed -i "s|__SITE_TITLE__|${{ vars.SITE_TITLE }}|g" index.html
          sed -i "s|__SITE_COLOR__|${{ vars.SITE_COLOR }}|g" style.css
          sed -i "s|__DEPLOY_TIME__|${DEPLOY_TIME}|g" index.html
          sed -i "s|__COMMIT_SHA__|${COMMIT_SHA}|g" index.html
          sed -i "s|__SITE_TITLE__|${{ vars.SITE_TITLE }}|g" app.js
          sed -i "s|__DEPLOY_TIME__|${DEPLOY_TIME}|g" app.js

      - name: Deploy to EC2 via SSH (DEBUG)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euxo pipefail

          echo "== DEBUG: checking variables =="
          echo "HOST=$DEPLOY_HOST"
          echo "USER=$DEPLOY_USER"
          echo "PATH=$DEPLOY_PATH"
          echo "KEY_LENGTH=${#SSH_PRIVATE_KEY}"

          mkdir -p ~/.ssh

          echo "$SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          echo "== DEBUG: testing SSH =="
          ssh -vvv -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "echo SSH_OK"

          echo "== DEBUG: deploying files =="
          scp -vvv -i ~/.ssh/deploy_key index.html style.css app.js \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

          echo "✅ DEPLOY COMPLETE"


      - name: Verify deployment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST "ls -la $DEPLOY_PATH"
          echo "✅ Deployment verified!"
